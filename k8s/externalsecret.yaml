apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
 name: review-service-secret-configuration
 namespace: review-service
spec:
 refreshInterval: "24h"
 secretStoreRef:
   name: aws-parameterstore-store
   kind: ClusterSecretStore
 target:
   name: review-service-secret
 data:
 - secretKey: TEST_SECRET
   remoteRef:
     key: /test/title #  SSM에 생성한 파라미터 경로
