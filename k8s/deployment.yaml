apiVersion: apps/v1
kind: Deployment
metadata:
 name: review-service
 namespace: review-service
 annotations:
    # 참조 중인 K8s Secret / ConfigMap 변경 시 자동 Rolling Restart
    reloader.stakater.com/auto: "true"

 labels:
   app: review-service
spec:
 replicas: 2
 selector:
   matchLabels:
     app: review-service
 strategy:
   type: RollingUpdate
   rollingUpdate:
     maxSurge: 1
     maxUnavailable: 0
 template:
   metadata:
     labels:
       app: review-service

   spec:
     containers:
       - name: review-service
         image: zerockcode1/review-service:sha-5f335b1
         imagePullPolicy: Always
         ports:
           - containerPort: 8083
         envFrom:
           - configMapRef:
               name: review-service-config
           - secretRef:
              name: review-service-secret          
         resources:
           requests:
             cpu: "100m"
             memory: "256Mi"
           limits:
             cpu: "500m"
             memory: "512Mi"
         livenessProbe:
           httpGet:
             path: /actuator/health/liveness
             port: 8083
           initialDelaySeconds: 30
           periodSeconds: 15
           failureThreshold: 3
         readinessProbe:
           httpGet:
             path: /actuator/health/readiness
             port: 8083
           initialDelaySeconds: 20
           periodSeconds: 10
           failureThreshold: 3
     terminationGracePeriodSeconds: 30
